# SÂNDÉ — local dev stack (no Supabase)
#
# The FastAPI backend is the sole backend: own JWT auth, Postgres data,
# MinIO object storage. The frontend talks only to the backend.
#
# Copy infra/.env.example to infra/.env before first run.

name: sandeh

# Shared backend environment. B5.1e: `DATABASE_URL` is the **DML-only application
# role** the API and the worker connect with — no DDL, no ownership, not a
# superuser. The one-shot `db-init` job overrides it with `DATABASE_MIGRATOR_URL`
# (the schema owner) and also creates/refreshes that app role.
x-backend-env: &backend_env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${DATABASE_APP_USER:-sande_app}:${DATABASE_APP_PASSWORD:-sande-app}@postgres:5432/${POSTGRES_DB:-postgres}}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sande}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sande-secret}
  # Host the browser uses; presigned URLs are signed for this host, so it must
  # be reachable from the browser (not the in-cluster `minio:9000`).
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:${MINIO_PORT:-9000}}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sande.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}

# Migration / maintenance environment (B5.1e): the schema owner. Used by the one-shot
# `db-init` job and by `tools` for ad-hoc DDL and the optional seeds. The API and the
# worker never see these credentials.
x-migrator-env: &migrator_env
  <<: *backend_env
  DATABASE_URL: ${DATABASE_MIGRATOR_URL:-postgresql+asyncpg://${POSTGRES_USER:-sande}:${POSTGRES_PASSWORD:-sande}@postgres:5432/${POSTGRES_DB:-postgres}}
  DATABASE_MIGRATOR_URL: ${DATABASE_MIGRATOR_URL:-postgresql+asyncpg://${POSTGRES_USER:-sande}:${POSTGRES_PASSWORD:-sande}@postgres:5432/${POSTGRES_DB:-postgres}}
  DATABASE_APP_USER: ${DATABASE_APP_USER:-sande_app}
  DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:-sande-app}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sande}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sande}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sande} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # quay.io, not Docker Hub: MinIO stopped publishing free images there in Oct 2025.
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sande}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sande-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the public-read `product-images` bucket.
  # Reuses the server image, which already ships /usr/bin/mc — the standalone
  # minio/mc image is no longer published on Docker Hub (pull access denied).
  minio-init:
    image: quay.io/minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sande}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sande-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb --ignore-existing local/product-images
        mc anonymous set download local/product-images
        echo 'minio ready: bucket product-images (public read)'

  # One-shot: bootstrap users + 20-product catalog + demo activity + coupons.
  db-init:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    # B5.1e: this one-shot job is the migrator — it runs `startup_ddl()` and the
    # seeds as the schema owner, and creates the DML-only app role the API uses.
    environment: *migrator_env
    command: >
      /bin/sh -c "
      python -m app.seed_auth &&
      python -m app.seed_products &&
      python -m app.seed_demo &&
      python -m app.seed_coupons"
    restart: "no"

  # Maintenance as the schema owner (B5.1e): ad-hoc DDL and the optional seeds.
  # Nothing starts this on `up` (profile "tools"); target it explicitly:
  #   docker compose run --rm tools python -m app.seed_mock
  tools:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment: *migrator_env
    volumes:
      # hot reload: local source shadows the pip-installed copy
      - ../backend/app:/srv/app
    profiles: ["tools"]
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # B5.1e: the API runs no DDL any more, so the schema (and the app role it
      # connects with) must exist before it serves a request
      db-init:
        condition: service_completed_successfully
    # anchored so the B2.5 worker runs with exactly the same settings
    environment: &backend_runtime_env
      <<: *backend_env
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-00000000-0000-0000-0000-000000000000}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${BACKEND_PORT:-8000}}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-5173}}
      SHIPPING_FLAT_FEE: ${SHIPPING_FLAT_FEE:-89000}
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-2000000}
      # B3.11: X-Forwarded-For is believed only from these proxies (none by default)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CONTACT_RATE_LIMIT: ${CONTACT_RATE_LIMIT:-5}
      CONTACT_RATE_WINDOW_SECONDS: ${CONTACT_RATE_WINDOW_SECONDS:-600}
      # B2.1 notification providers. Empty = unconfigured: nothing is sent and the
      # in-app notifications keep working. Credentials live here only, never in the DB.
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      # F2.3 password reset: link lifetime and links per account per hour
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      PASSWORD_RESET_MAX_PER_HOUR: ${PASSWORD_RESET_MAX_PER_HOUR:-3}
      # B2.5 background worker: pass interval, abandoned-payment reminder window,
      # outbox sweeper (stale pending, retry backoff and cap)
      JOBS_INTERVAL_SECONDS: ${JOBS_INTERVAL_SECONDS:-60}
      PAYMENT_REMINDER_AFTER_MINUTES: ${PAYMENT_REMINDER_AFTER_MINUTES:-60}
      PAYMENT_REMINDER_MAX_AGE_HOURS: ${PAYMENT_REMINDER_MAX_AGE_HOURS:-72}
      NOTIFICATION_PENDING_STALE_SECONDS: ${NOTIFICATION_PENDING_STALE_SECONDS:-120}
      NOTIFICATION_RETRY_BACKOFF_SECONDS: ${NOTIFICATION_RETRY_BACKOFF_SECONDS:-120}
      NOTIFICATION_RETRY_MAX_ATTEMPTS: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:-5}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # hot reload: local source shadows the pip-installed copy
      - ../backend/app:/srv/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # B2.5 background jobs (app/services/jobs.py): the notification-outbox sweeper and
  # abandoned-payment reminders, one pass every JOBS_INTERVAL_SECONDS. Same image and
  # settings as the backend; each job takes an advisory lock, so extra workers are safe.
  # No hot reload — `docker compose restart worker` after changing the jobs.
  worker:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment: *backend_runtime_env
    volumes:
      - ../backend/app:/srv/app

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Browser → backend API base (Vite injects import.meta.env at dev time)
      VITE_API_URL: ${VITE_API_URL:-http://localhost:${BACKEND_PORT:-8000}}
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:${BACKEND_PORT:-8000}}
      # MinIO as the browser reaches it (for image URLs)
      VITE_MINIO_URL: ${VITE_MINIO_URL:-http://localhost:${MINIO_PORT:-9000}}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../vogue-vintage-vibes:/app
      # keep the image's node_modules instead of the host's
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  miniodata:
  frontend_node_modules:
